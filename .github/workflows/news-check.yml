name: news-check

# PR ごとに記事基盤の機械検証を実行する。
# Claude がマージまで行う運用のため、ここが不合格ならマージしない。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  news-check:
    runs-on: ubuntu-latest
    env:
      # 記事の公開日は日本時間で付けるため、「未来の日付」の判定も日本時間で行う
      # （GitHub の実行環境は UTC のため、日本時間の早朝に作った記事が不合格になるのを防ぐ）。
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 一覧HTMLが articles_index.json と一致しているか（生成漏れの検出）
        run: python -B scripts/render_news_index.py --check
      - name: 記事の構造・出典・レビュー記録・SHA-256 の検証
        run: python -B scripts/validate_news.py
      - name: 一覧生成スクリプトのテスト
        run: python -B scripts/test_render_news_index.py
